services:
  postgres:
    image: postgres:16-alpine
    container_name: kidzone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidzone
      POSTGRES_PASSWORD: kidzone
      POSTGRES_DB: kidzone
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kidzone -d kidzone']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kidzone-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kidzone-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kidzone:kidzone@postgres:5432/kidzone?schema=public
      TEST_DATABASE_URL: postgresql://kidzone:kidzone@postgres:5432/kidzone_test?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./test:/app/test
      - ./scripts:/app/scripts
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

volumes:
  postgres-data:
  redis-data:
